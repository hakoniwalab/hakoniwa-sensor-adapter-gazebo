[workspace]
name = "hakoniwa-sensor-adapter-gazebo"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
gz-sensors = "==10.2.0"
cmake = ">=3.16"
ninja = "*"
cxx-compiler = "*"
pkg-config = "*"

[tasks]
configure = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHAKONIWA_SENSOR_ADAPTER_GAZEBO_BUILD_TESTS=ON -DCMAKE_PREFIX_PATH=$CONDA_PREFIX"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
